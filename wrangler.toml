# Cloudflare Pages + D1 configuration.
#
# 1. Credentials: copy .cloudflare.env.example → .cloudflare.env
# 2. Prep + deploy: npm run deploy:migrate
#
# The Nuxt server reads D1 binding as event.context.cloudflare.env.DB.

name = "jingshi"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat_v2"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "jingshi"
database_id = "fb37578b-5bb0-4358-a1c6-7631f966a4fd"
migrations_dir = "node_modules/nuxtcms/server/database/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "jingshi"
